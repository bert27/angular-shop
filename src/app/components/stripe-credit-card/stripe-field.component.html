<div>
  <div id="card-element" class="stripe-card"></div>
  <div id="card-errors" role="alert"></div>

  <div class="button-group" style="display: flex; justify-content: space-between">
    <custom-button texto="Atrás" tipo="secundario" (click)="goToPreviousStep()" />
    <custom-button texto="Tramitar Pago" tipo="primario" (click)="processPayment()" [disabled]="!cardElement" />
    <custom-button texto="Siguiente" tipo="secundario" (click)="goToNextStep()" />
  </div>

  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
</div>
