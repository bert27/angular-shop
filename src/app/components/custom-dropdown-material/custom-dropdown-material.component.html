<mat-form-field appearance="outline" class="dropdown-father">
  <mat-label class="custom-label">Tamaño</mat-label>
  <mat-select class="custom-select" [(ngModel)]="selectedOption" (selectionChange)="selectOption($event.value)">
    @for (option of options; track option) {
      <mat-option class="custom-option" [value]="option">
        {{ option.tipo }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
