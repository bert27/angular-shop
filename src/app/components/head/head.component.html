<header id="app-header" class="header">
  <div class="header__column--primary">
    <img [src]="logoSrc" alt="Shop logo" class="header__logo" (click)="navigateToInicio()" />
  </div>

  <div class="header__column--secondary">
    @if (!isMobile) {
      <nav class="header__nav-menu">
        <a class="header__nav-link" routerLink="/productos">Productos</a>
        <a class="header__nav-link" routerLink="/metodo-envio">Método de Envío</a>
        <a class="header__nav-link" routerLink="/blog">Blog</a>
      </nav>
    } @else {
      <div
        mat-icon-button
        class="burger-menu"
        [class.open]="menuOpen"
        [matMenuTriggerFor]="menu"
        aria-label="Menú de navegación"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span></span>
      </div>

      <mat-menu #menu="matMenu" (closed)="menuOpen = false">
        <button mat-menu-item routerLink="/productos" routerLinkActive="selected-menu-item" [routerLinkActiveOptions]="{ exact: true }">
          Productos
        </button>

        <button mat-menu-item routerLink="/metodo-envio" routerLinkActive="selected-menu-item" [routerLinkActiveOptions]="{ exact: true }">
          Método de Envío
        </button>

        <button mat-menu-item routerLink="/blog" routerLinkActive="selected-menu-item" [routerLinkActiveOptions]="{ exact: true }">
          Blog
        </button>
      </mat-menu>
    }

    <div class="header__cart" (mouseleave)="startAutoClose()">
      <!-- Theme Toggle Button -->
      <button mat-icon-button (click)="themeService.toggleTheme()" style="margin-right: 10px; color: white;">
        <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <div class="cart-icon-container" (click)="handleCarritoClick()" data-testid="cart-icon">
        <custom-icon-svg src="icons/carrito-de-compras.svg" [color]="'#ff8118'" [size]="isMobile ? 35 : 50" />
        <span class="header__cart-badge">{{ cantidadProductos }}</span>
      </div>
      <app-shopping-cart-popup />
    </div>
  </div>
</header>
