<form id="payment-form" (submit)="handleSubmit($event)">
  @if (errorMessage) {
    <div id="card-error">{{ errorMessage }}</div>
  }
  <div class="button-group">
    <!-- Botón para enviar el formulario y redirigir a Redsys -->
    <custom-button [texto]="isLoading ? 'Procesando...' : 'Pagar'" tipo="primario" [disabled]="isLoading" type="submit" testId="payment-btn" />
  </div>
</form>
