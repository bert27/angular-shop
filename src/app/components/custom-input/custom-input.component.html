<mat-form-field appearance="outline" class="form-field-class">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [type]="type"
    [formControl]="control"
    [errorStateMatcher]="matcher"
    (input)="handleInputChange($event)"
    (blur)="handleBlur()"
  />
  <mat-error *ngIf="control?.hasError('required')">
    {{ errorMessage }}
  </mat-error>
</mat-form-field>
