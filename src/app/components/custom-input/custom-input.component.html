<mat-form-field appearance="outline" class="input">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [type]="type"
    [formControl]="control"
    [errorStateMatcher]="matcher"
    (input)="handleInputChange($event)"
    (blur)="handleBlur()"
    />
    <mat-error>
      {{ errorText }}
    </mat-error>
  </mat-form-field>
