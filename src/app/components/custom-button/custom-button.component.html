@if (disabled) {
<button
  class="btn-primario disabled"
  [disabled]="true"
  [type]="type || 'button'"
>
  {{ texto }}
</button>
} @else if (tipo === 'primario') {
<button class="btn-primario" [type]="type || 'button'">
  {{ texto }}
</button>
} @else if (tipo === 'secundario') {
<button class="btn-secundario" [type]="type || 'button'">
  {{ texto }}
</button>
}
