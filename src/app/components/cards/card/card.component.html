<div class="card custom-card" id="my-card" (click)="navigateToProduct(cardData, selectedOption)">
  <component-image [cardData]="cardData" />
  <h1 class="title-card">{{ cardData.title }}</h1>

  <p *ngIf="isArticle(cardData)" class="description-class">
    {{ cardData.bodyTitle }}
  </p>

  <ng-container *ngIf="!isArticle(cardData)">
    <span *ngIf="cardData.description" class="description-class">
      {{ cardData.description }}
    </span>
    <div class="card-content-container">
      <div class="price-stock-container">
        <p *ngIf="selectedPrice" class="price-class">{{ selectedPrice }} €</p>
        <p *ngIf="cardData.stock; else noStock" class="en-stock" style="font-weight: 700; margin-left: 10px">En stock</p>
        <ng-template #noStock>
          <p class="agotado" style="font-weight: 700; margin-left: 10px">Agotado</p>
        </ng-template>
      </div>

      <div class="quantity-options-row" (click)="$event.stopPropagation()">
        <custom-quantity-selector
          [(value)]="quantity"
          (valueChange)="onQuantityChange($event)"
          (click)="$event.stopPropagation(); $event.preventDefault()"
        />
        <custom-dropdown-material [(selectedOption)]="selectedOption" [options]="cardData.options" />
      </div>

      <div class="button-row">
        <custom-button
          texto="Añadir a la cesta"
          tipo="primario"
          [disabled]="!cardData.stock || !selectedOption"
          (click)="handleAddToCart(); $event.stopPropagation()"
        />
      </div>
    </div>
  </ng-container>
</div>
