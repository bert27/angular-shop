<div class="dropdown" (click)="toggleDropdown()">
  <button class="dropdown-toggle">
    {{ selectedOption || 'Selecciona una opción' }}
    <span class="arrow">
      <span *ngIf="isOpen">&#9650;</span>
      <span *ngIf="!isOpen">&#9660;</span>
    </span>
  </button>
  <ul *ngIf="isOpen" class="dropdown-menu">
    <li *ngFor="let option of options" (click)="selectOption(option, $event)" [ngClass]="{ selected: selectedOption === option }">
      {{ option }}
    </li>
  </ul>
</div>
