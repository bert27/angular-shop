<mat-form-field appearance="outline" class="dropdown">

  <mat-select class="dropdown__select" [(ngModel)]="selectedOption" (selectionChange)="selectOption($event.value)">
    @for (option of options; track option) {
      <mat-option class="dropdown__option" [value]="option">
        {{ option.tipo }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
