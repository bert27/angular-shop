<div class="product-content">
  <div class="product-content-card">
    <div class="product-image">
      <img [src]="productData?.imageUrl" alt="{{ productData?.title }}" />
    </div>
    <div class="product-description">
      <h3 class="product-title">{{ productData?.title }}: {{ typeProduct }}</h3>
      <p class="description-text">{{ productData?.description }}</p>

      <!-- Nueva fila con precio y selector de cantidad -->
      <div class="price-quantity-row">
        <custom-quantity-selector
          [(value)]="quantity"
          (valueChange)="onQuantityChange($event)"
          (click)="$event.stopPropagation(); $event.preventDefault()"
        />
        <div class="price">{{ getPrice() }}€</div>
      </div>

      <div class="button-father">
        <custom-button
          texto="Añadir a la cesta"
          tipo="secundario"
          (click)="addShoppingBasket()"
        />
        <custom-button texto="Comprar ya" tipo="primario" (click)="buyNow()" />
      </div>
    </div>
  </div>
</div>
