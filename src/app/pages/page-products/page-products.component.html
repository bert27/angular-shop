<div class="container">
  <div class="categorys-products">
    <ng-container *ngFor="let category of categories">
      <custom-button (click)="selectCategory(category)" [texto]="category" tipo="primario" />
    </ng-container>
  </div>
  <div class="content">
    @if (filteredProducts.length > 0) {
      <custom-cards [items]="filteredProducts" />
    } @else {
      <p>No hay productos disponibles en esta categoría.</p>
    }
  </div>
</div>
