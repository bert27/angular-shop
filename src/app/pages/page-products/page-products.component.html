<div class="container">
  <div class="categorys-products">
    @for (category of categories; track category) {
      <button class="category-item" (click)="selectCategory(category)" [class.active]="selectedCategory === category">
        {{ category }}
      </button>
    }
  </div>
  <div class="content">
    @if (filteredProducts.length > 0) {
      <custom-cards [items]="filteredProducts" />
    } @else {
      <p>No hay productos disponibles en esta categoría.</p>
    }
  </div>
</div>
