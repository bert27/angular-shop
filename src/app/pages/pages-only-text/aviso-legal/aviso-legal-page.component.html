<section class="container">
  <h2>Aviso Legal</h2>
  @for (paragraph of paragraphs; track paragraph) {
    @if (!paragraph.bold && !paragraph.isHtml) {
      <p [innerHTML]="paragraph.text"></p>
    }
    @if (paragraph.bold && !paragraph.isHtml) {
      <p class="highlight-text" [innerHTML]="paragraph.text"></p>
    }
    @if (paragraph.isHtml) {
      <p [innerHTML]="paragraph.text"></p>
    }
  }
</section>
