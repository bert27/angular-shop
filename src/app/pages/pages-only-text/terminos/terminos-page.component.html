<section class="container">
  @for (term of terms; track term) {
    <div>
      <h2
      [ngClass]="{
        'bold-title': term.isBold,
        'payment-method': term.isPaymentMethod,
      }"
        >
        {{ term.title }}
      </h2>
      <p>{{ term.content }}</p>
    </div>
  }
</section>
